services:
  app:
    build:
      context: .
      dockerfile: prod.Dockerfile
    image: parakeet-asr:prod
    container_name: parakeet-asr-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      NUM_WORKERS: ${NUM_WORKERS:-}
      MODEL_NAME: ${MODEL_NAME:-nvidia/nemotron-3.5-asr-streaming-0.6b}
      ATT_CONTEXT_SIZE: ${ATT_CONTEXT_SIZE:-56,6}
      TARGET_LANG: ${TARGET_LANG:-auto}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    volumes:
      - ${HF_HOME:-./server/models}:/cache/hf
      - ${HF_HOME:-./server/cache}:/cache/torch
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
