services:
  server:
    container_name: parakeet-asr-server-api
    build:
      context: ./server
    image: parakeet-asr-server
    ports:
      - "9000:9000"
    environment:
      NUM_WORKERS: ${NUM_WORKERS:-}
      MODEL_NAME: ${MODEL_NAME:-nvidia/canary-1b-v2}
      MODEL_PATH: ${MODEL_PATH:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-}
      # default language for models that take language args (Canary)
      DEFAULT_SOURCE_LANG: ${DEFAULT_SOURCE_LANG:-}
      DEFAULT_TARGET_LANG: ${DEFAULT_TARGET_LANG:-}
      SSE_CHUNK_DURATION: ${SSE_CHUNK_DURATION:-20}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      # batching scheduler
      BATCH_WINDOW_MS: ${BATCH_WINDOW_MS:-20}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-8}
      MAX_BATCH_AUDIO_SECONDS: ${MAX_BATCH_AUDIO_SECONDS:-240}
      MAX_BATCH_ITEM_SECONDS: ${MAX_BATCH_ITEM_SECONDS:-30}
      BATCH_DURATION_RATIO: ${BATCH_DURATION_RATIO:-2}
      INLINE_AUDIO_MAX_SECONDS: ${INLINE_AUDIO_MAX_SECONDS:-30}
      # admission control
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-32}
      QUEUE_TIMEOUT_S: ${QUEUE_TIMEOUT_S:-120}
      RETRY_AFTER_S: ${RETRY_AFTER_S:-2}
      # live streaming limits
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-0}
      # live streaming tuning (model-dependent)
      STREAM_MIN_DURATION: ${STREAM_MIN_DURATION:-1.0}
      STREAM_RETRANSCRIBE_INTERVAL: ${STREAM_RETRANSCRIBE_INTERVAL:-0.5}
      STREAM_STABLE_WORDS: ${STREAM_STABLE_WORDS:-1}
      STREAM_STABLE_ITERS: ${STREAM_STABLE_ITERS:-2}
      STREAM_MAX_DURATION: ${STREAM_MAX_DURATION:-30}
      STREAM_CONTEXT_DURATION: ${STREAM_CONTEXT_DURATION:-1.5}
      STREAM_TRIM_DURATION: ${STREAM_TRIM_DURATION:-10}
      STREAM_HOLDBACK: ${STREAM_HOLDBACK:-0}
      STREAM_MAX_QUEUE_SECONDS: ${STREAM_MAX_QUEUE_SECONDS:-120}
      STREAM_MAX_SESSION_SECONDS: ${STREAM_MAX_SESSION_SECONDS:-3600}
      # inference numerics
      TORCH_DTYPE: ${TORCH_DTYPE:-auto}
      MATMUL_PRECISION: ${MATMUL_PRECISION:-high}
      # observability
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    volumes:
      - ${HF_HOME:-./server/models}:/cache/hf
      - ${HF_HOME:-./server/cache}:/cache/torch
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    develop:
      watch:
        - action: sync+restart
          path: ./server/app
          target: /app/app
        - action: rebuild
          path: ./server/pyproject.toml

  frontend:
    container_name: parakeet-asr-server-frontend
    build:
      context: ./frontend
      target: dev
    image: parakeet-asr-frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://server:9000}
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/deno.json

volumes:
  model-cache:
