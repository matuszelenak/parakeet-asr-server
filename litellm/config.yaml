# Example LiteLLM proxy config for the Parakeet ASR server.
#
#   litellm --config litellm/config.yaml --port 4000
#
# Replace http://parakeet-asr:9000 with the address LiteLLM can reach the ASR
# server at (e.g. the compose service name, or http://localhost:9000).

model_list:
  # Standard OpenAI route: POST /v1/audio/transcriptions with model=parakeet.
  # The "openai/" prefix makes LiteLLM treat the server as a generic
  # OpenAI-compatible backend; everything after it is sent upstream as the
  # `model` field (the ASR server accepts any value).
  - model_name: parakeet
    litellm_params:
      model: openai/nvidia/canary-1b-v2
      api_base: http://parakeet-asr:9000/v1
      api_key: "none"  # the ASR server does not check it
    model_info:
      mode: audio_transcription  # enables `litellm --health` / /health checks

general_settings:
  master_key: sk-change-me

  # LiteLLM's /v1/audio/transcriptions route always returns a complete
  # (non-streamed) response, so SSE streaming (stream=true) and the native
  # endpoints are exposed through an authenticated pass-through route instead:
  #   POST {litellm}/parakeet/v1/audio/transcriptions  (stream=true supported)
  #   POST {litellm}/parakeet/v1/transcribe/timestamps
  pass_through_endpoints:
    - path: /parakeet
      target: http://parakeet-asr:9000
      include_subpath: true
      auth: true  # require a LiteLLM key (Authorization: Bearer sk-...)
