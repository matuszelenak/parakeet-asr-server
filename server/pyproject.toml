[project]
name = "parakeet-asr-server"
version = "0.1.0"
description = "FastAPI server exposing NVIDIA Parakeet/Canary ASR (OpenAI-compatible, LiteLLM-ready)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "torch>=2.12.0",
    "nemo-toolkit[asr]>=3.0.0",
    "logfire[fastapi]>=5.2.0",
    "numpy>=2.5.4",
    "scipy>=1.16",
    "soundfile>=0.14.0",
    "prometheus-client>=0.21.0",
    "websockets>=17.2",
    "granian>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
