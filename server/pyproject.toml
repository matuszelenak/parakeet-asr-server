[project]
name = "parakeet-asr-server"
version = "0.1.0"
description = "FastAPI server exposing NVIDIA Parakeet/Canary ASR (plain / timestamped / long-form)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "nemo-toolkit[asr]>=2.7.3",
    "fastapi>=0.136.3",
    "logfire[fastapi]>=4.34.0",
    "numpy>=1.26.4",
    "soundfile>=0.13.1",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
