[project]
name = "nemotron-asr-server"
version = "0.2.0"
description = "FastAPI server exposing NVIDIA Nemotron cache-aware streaming ASR (live + plain / timestamped / long-form)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@main",
    "fastapi>=0.136.3",
    "logfire[fastapi]>=4.34.0",
    "numpy>=1.26.4",
    "soundfile>=0.13.1",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because nemo-toolkit is pulled directly from a git URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

# NeMo (installed from git main) declares its own CUDA-specific torch indexes
# (incl. download.pytorch.org/whl/cpu), which conflict with our PyPI torch pin.
# The root project's sources win, so force torch/torchaudio from PyPI — those
# linux wheels are CUDA-enabled, which is what we want on the GPU server.
[tool.uv]
# We only ever build/run this on linux (GPU server / linux Docker image).
# Restricting the resolution environment avoids win32/darwin marker splits that
# otherwise reintroduce NeMo's conflicting torch indexes.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pypi-torch" }
torchaudio = { index = "pypi-torch" }

[[tool.uv.index]]
name = "pypi-torch"
url = "https://pypi.org/simple"
explicit = true
